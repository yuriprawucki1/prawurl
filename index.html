<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="description" content="PrawURL encurta, organiza e audita links com velocidade de edge." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        try {
          const key = "prawurl-theme";
          const cookie = document.cookie.split("; ").find((item) => item.startsWith("prawurl_theme="));
          let theme = cookie ? cookie.split("=")[1] : window.localStorage.getItem(key);
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
        } catch {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <title>PrawURL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
