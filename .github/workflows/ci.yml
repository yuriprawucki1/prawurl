name: CI | Pull requests

on:
  pull_request:
    branches: ["main", "staging"]

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Validar alteração
    uses: ./.github/workflows/validate.yml
    with:
      target: ${{ github.base_ref == 'staging' && 'staging' || 'production' }}

  promotion:
    name: Confirmar promoção de staging
    if: ${{ github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Exigir staging publicado e sem alterações exclusivas de main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-staging.mjs
