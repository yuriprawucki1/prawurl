name: Produção | Monitor e recuperação

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: prawurl-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  health:
    name: Monitorar endpoints públicos
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verificar API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 6); do
            response="$(curl --fail --silent --show-error --location --max-time 15 --retry 2 --retry-all-errors -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.prawurl.com/health || true)"
            if printf '%s' "$response" | jq -e '.ok == true and .service == "prawurl-api"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check da API falhou."
          exit 1

      - name: Verificar site público
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -o /dev/null https://prawurl.com/

      - name: Verificar dashboard
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -o /dev/null https://app.prawurl.com/app

  recover:
    name: Recuperar última versão saudável
    needs: health
    if: ${{ always() && needs.health.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Identificar versão atual e última publicação saudável
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" fetch --quiet origin main
          git checkout --quiet --detach origin/main
          current_sha="$(git rev-parse HEAD)"
          current_subject="$(git log -1 --format=%s)"
          echo "current_sha=$current_sha" >> "$GITHUB_OUTPUT"
          if [[ "$current_subject" == *"[auto-rollback]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A versão atual já é um rollback automático; não será feito rollback em cadeia."
            exit 0
          fi
          runs_json="$(gh api "/repos/$REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=100")"
          target_sha=""
          while IFS= read -r candidate; do
            if [ "$candidate" = "$current_sha" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$candidate" "$current_sha"; then
              target_sha="$candidate"
              break
            fi
          done < <(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha')
          if [ -z "$target_sha" ]; then
            echo "Não foi possível identificar uma publicação saudável anterior."
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Parar sem rollback em cadeia
        if: ${{ steps.select.outputs.skip == 'true' }}
        run: |
          echo "A saúde continua falhando após um rollback automático; requer investigação de infraestrutura."
          exit 1

      - name: Checkout da versão saudável
        if: ${{ steps.select.outputs.skip != 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.select.outputs.target_sha }}
          fetch-depth: 0

      - name: Preparar Node
        if: ${{ steps.select.outputs.skip != 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: npm ci --include=dev --ignore-scripts --no-audit

      - name: Build da versão saudável
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: npm run build

      - name: Restaurar API Worker
        if: ${{ steps.select.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api:production

      - name: Restaurar Redirect Worker
        if: ${{ steps.select.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:redirect:production

      - name: Restaurar Pages
        if: ${{ steps.select.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:web:production

      - name: Confirmar recuperação
        if: ${{ steps.select.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 20 --retry 10 --retry-all-errors -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.prawurl.com/health)"
          printf '%s' "$response" | jq -e '.ok == true and .service == "prawurl-api"' >/dev/null
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -o /dev/null https://prawurl.com/
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -o /dev/null https://app.prawurl.com/app

      - name: Registrar rollback exato no main
        if: ${{ steps.select.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ steps.select.outputs.current_sha }}
          TARGET_SHA: ${{ steps.select.outputs.target_sha }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          remote_sha="$(git rev-parse origin/main)"
          if [ "$remote_sha" != "$CURRENT_SHA" ]; then
            echo "main mudou durante a recuperação; não sobrescrevendo alterações novas."
            exit 1
          fi
          git checkout --quiet --detach "$CURRENT_SHA"
          git diff --binary "$TARGET_SHA" "$CURRENT_SHA" | git apply --reverse
          git add -A
          if git diff --cached --quiet; then
            echo "A árvore já coincide com a versão saudável; nenhum commit de rollback necessário."
            exit 0
          fi
          git config user.name "prawurl-automation"
          git config user.email "prawurl-automation@users.noreply.github.com"
          git commit --no-edit -m "revert: rollback automático para $TARGET_SHA [auto-rollback]"
          git -c http.extraheader="AUTHORIZATION: bearer $GH_TOKEN" push origin HEAD:main
