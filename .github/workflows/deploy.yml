name: CD | Produção

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: prawurl-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  VITE_API_ORIGIN: https://api.prawurl.com
  VITE_PUBLIC_ORIGIN: https://prawurl.com
  VITE_APP_ORIGIN: https://app.prawurl.com

jobs:
  promotion:
    name: Confirmar versão validada em staging
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Exigir publicação saudável da mesma árvore em staging
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-staging.mjs

  validate:
    name: Validar produção
    needs: promotion
    uses: ./.github/workflows/validate.yml
    with:
      target: production

  deploy:
    name: Publicar em produção
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências sem scripts
        run: npm ci --include=dev --ignore-scripts --no-audit

      - name: Validar secrets de produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          LOG_HASH_SALT: ${{ secrets.LOG_HASH_SALT }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "SESSION_SECRET",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "GITHUB_CLIENT_ID",
            "GITHUB_CLIENT_SECRET",
            "LOG_HASH_SALT",
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error(`Secrets obrigatórios ausentes: ${missing.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Baixar frontend aprovado na validação
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-${{ github.sha }}
          path: dist

      - name: Aplicar migrações D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply prawurl --remote --config wrangler.api.jsonc

      - name: Publicar API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api:production

      - name: Publicar Redirect Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:redirect:production

      - name: Atualizar secrets do API Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const names = ["SESSION_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET"];
          fs.writeFileSync("/tmp/prawurl-api-secrets.json", JSON.stringify(Object.fromEntries(names.map((name) => [name, process.env[name]]))));
          NODE
          npx wrangler secret bulk /tmp/prawurl-api-secrets.json --config wrangler.api.jsonc

      - name: Atualizar secrets do Redirect Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          LOG_HASH_SALT: ${{ secrets.LOG_HASH_SALT }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          fs.writeFileSync("/tmp/prawurl-redirect-secrets.json", JSON.stringify({
            SESSION_SECRET: process.env.SESSION_SECRET,
            LOG_HASH_SALT: process.env.LOG_HASH_SALT,
          }));
          NODE
          npx wrangler secret bulk /tmp/prawurl-redirect-secrets.json --config wrangler.redirect.jsonc

      - name: Publicar Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:web:production

  health:
    name: Verificar produção
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verificar API com tentativas
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --location --max-time 15 --retry 2 --retry-all-errors -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.prawurl.com/health || true)"
            if printf '%s' "$response" | jq -e '.ok == true and .service == "prawurl-api"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Health check da API falhou após 12 tentativas."
          exit 1

      - name: Verificar site público
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -o /dev/null https://prawurl.com/

      - name: Verificar dashboard
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -H 'Cache-Control: no-cache' -o /dev/null https://app.prawurl.com/app

  rollback:
    name: Rollback automático
    needs: [validate, deploy, health]
    if: ${{ always() && github.event_name == 'push' && needs.validate.result == 'success' && (needs.deploy.result == 'failure' || needs.health.result == 'failure') && !contains(github.event.head_commit.message, '[auto-rollback]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout para identificar a versão saudável anterior
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Selecionar publicação anterior saudável
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "/repos/$REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=100")"
          target_sha=""
          while IFS= read -r candidate; do
            if [ "$candidate" = "$CURRENT_SHA" ]; then
              continue
            fi
            if git merge-base --is-ancestor "$candidate" "$CURRENT_SHA"; then
              target_sha="$candidate"
              break
            fi
          done < <(printf '%s' "$runs_json" | jq -r '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha')
          if [ -z "$target_sha" ]; then
            echo "Nenhuma publicação anterior saudável foi encontrada; recuperação automática interrompida."
            exit 1
          fi
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout da última versão saudável
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.previous.outputs.target_sha }}
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências da versão anterior
        run: npm ci --include=dev --ignore-scripts --no-audit

      - name: Build da versão anterior
        run: npm run build

      - name: Restaurar API Worker anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:api:production

      - name: Restaurar Redirect Worker anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:redirect:production

      - name: Restaurar Pages anterior
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:web:production

      - name: Confirmar saúde após rollback
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location --max-time 20 --retry 10 --retry-all-errors -H 'Accept: application/json' -H 'Cache-Control: no-cache' https://api.prawurl.com/health)"
          printf '%s' "$response" | jq -e '.ok == true and .service == "prawurl-api"' >/dev/null
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -o /dev/null https://prawurl.com/
          curl --fail --silent --show-error --location --max-time 20 --retry 5 --retry-all-errors -o /dev/null https://app.prawurl.com/app

      - name: Registrar rollback exato no main
        env:
          EXPECTED_CURRENT_SHA: ${{ github.sha }}
          TARGET_SHA: ${{ steps.previous.outputs.target_sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$EXPECTED_CURRENT_SHA" ]; then
            echo "main mudou durante a recuperação; não sobrescrevendo alterações novas."
            exit 1
          fi
          git checkout --quiet --detach "$EXPECTED_CURRENT_SHA"
          git diff --binary "$TARGET_SHA" "$EXPECTED_CURRENT_SHA" | git apply --reverse
          git add -A
          if git diff --cached --quiet; then
            echo "A árvore já coincide com a versão anterior; nenhum commit de rollback necessário."
            exit 0
          fi
          git config user.name "prawurl-automation"
          git config user.email "prawurl-automation@users.noreply.github.com"
          git commit --no-edit -m "revert: rollback automático para $TARGET_SHA [auto-rollback]"
          git -c http.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" push origin HEAD:main
